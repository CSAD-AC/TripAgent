spring:
  application:
    name: Agent

  config:
    import: optional:classpath:.env[.properties]

  profiles:
    default: deepseek

  # 始终排除 DashScope starter 的自动配置.
  # 原因: LLMConfig 里已经手动装配了一个名为 dashScopeChatModel 的 ChatModel bean,
  # starter 的 DashScopeChatAutoConfiguration 也会注册同名 bean,
  # 触发 BeanDefinitionOverrideException(Spring Boot 2.1+ 默认禁止 bean 覆盖).
  # 这个冲突与 profile 无关, 所以不能只写在 deepseek profile 里, 否则 dev / dashscope
  # profile 启动必然失败. DashScope 凭据由 LLMConfig 直接读 .env 的 DASHSCOPE_API_KEY,
  # 不依赖这里的自动配置.
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration

  ai:
    mcp:
      client:
        enabled: true
        name: agent-client
        version: 1.0.0
        type: SYNC
        streamable-http:
          connections:
            local-mcp:
              # 容器/多机部署时用 MCP_SERVER_URL 覆盖(例如 http://mcp-server:8081);
              # 未设置时回落到 localhost, 与本地开发行为一致.
              url: ${MCP_SERVER_URL:http://localhost:8081}
              endpoint: /mcp

    # 使用 OpenAI 客户端指向 DeepSeek API(消息转换格式更准确)
    # 放在根节点而不是某个 profile 里: LLMConfig 无条件注册 deepSeekChatModel,
    # 而它依赖 spring-ai-openai 自动配置提供的 OpenAiChatModel. 若这段配置只写在
    # deepseek profile 下, 其他 profile(dev / dashscope)会因缺少 api-key 而启动失败
    # (OpenAI API key must be set).
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      connect-timeout: 30s
      read-timeout: 120s
      # DeepSeek 思考模式参数(非标准 OpenAI 属性, 通过 @Value 手动注入)
      deepseek:
        thinking: enabled      # 思考模式开关 enabled/disabled
        reasoning-effort: high  # 思考强度 (high/max)
      chat:
        options:
          model: deepseek-v4-flash
          max-tokens: 16384

agent:
  react:
    max-iterations: 20
    timeout-seconds: 30

# MCP 客户端连接: agent-core 经此基础地址调 mcp-server(:8081) 的 REST(知识库等)
# 由 McpClientProperties(prefix=mcp) 绑定并启动校验(@Validated)
# 与上面的 MCP 客户端连接共用同一个 MCP_SERVER_URL 环境变量, 部署时只需设一次.
mcp:
  server-url: ${MCP_SERVER_URL:http://localhost:8081}

# 对话消息缓存 TTL(秒),作用在 RedisMessageCache@persistentChatMemory
# 仅在生产 profile(非 dev/test)下生效,因为 InMemoryChatMemory 不依赖 Redis
app:
  cache:
    session-ttl: 1800
  # 对话历史滑动窗口压缩(生产标配): 保留最近 N 条完整消息, 超限时异步把最旧段
  # LLM 摘要写入 conversation.summary 并在加载时前缀注入. 0 = 关闭(默认, 不压缩)
  memory:
    window-size: 0
  # 模型注册表: 列表顺序即前端展示顺序, 第一项为默认模型(未指定 modelId 时回退)
  # provider 与 ChatModel 实现的 bean 路由键对应(见 ModelRouter)
  models:
    - id: deepseek
      provider: deepseek
      model: deepseek-flash
      display-name: DeepSeek-V4.1-Flash
    - id: qwen
      provider: dashscope
      model: qwen3.6-flash
      display-name: 通义千问 3.6 Flash

clarify:
  timeout-minutes: 10

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    uno.zhuchen.agent: DEBUG
    uno.zhuchen.workflow: DEBUG
    org.springframework.ai: INFO
    #reactor.netty.http.client: DEBUG   # 打印 HTTP 请求/响应 body，调试 DeepSeek 400 时开启
---
spring:
  config:
    activate:
      on-profile: dashscope
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      connection-timeout: 30000
      read-timeout: 120000
      chat:
        options:
          model: qwen3.6-flash
          multi-model: true
---
spring:
  config:
    activate:
      on-profile: dev
  ai:
    dashscope:
      chat:
        options:
          model: qwen-turbo

---
# ============================================================
# 持久化配置（datasource / mybatis-plus / redis / flyway）
# 注意：仅在非 dev/test profile 下生效
# ============================================================
spring:
  config:
    activate:
      on-profile: deepseek & !dev & !test

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    slow-sql-ms: 500
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: status
      logic-delete-value: deleted
      logic-not-delete-value: active

# Actuator / Micrometer 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: travelpal-agent





spring:
  application:
    name: Agent

  config:
    import: optional:classpath:.env[.properties]

  profiles:
    default: deepseek

  ai:
    mcp:
      client:
        enabled: true
        name: agent-client
        version: 1.0.0
        type: SYNC
        streamable-http:
          connections:
            local-mcp:
              url: http://localhost:8081
              endpoint: /mcp

agent:
  react:
    max-iterations: 20
    timeout-seconds: 30

clarify:
  timeout-minutes: 10

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    uno.zhuchen.agent: DEBUG
    uno.zhuchen.workflow: DEBUG
    org.springframework.ai: INFO
    #reactor.netty.http.client: DEBUG   # 打印 HTTP 请求/响应 body，调试 DeepSeek 400 时开启
---
spring:
  config:
    activate:
      on-profile: dashscope
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      connection-timeout: 30000
      read-timeout: 120000
      chat:
        options:
          model: qwen3.6-flash
          multi-model: true
---
spring:
  config:
    activate:
      on-profile: dev
  ai:
    dashscope:
      chat:
        options:
          model: qwen-turbo
---
spring:
  config:
    activate:
      on-profile: deepseek
  autoconfigure:
    exclude:
      # spring-ai-alibaba-starter-dashscope 在 classpath 上，deepseek profile 下不需 DashScope
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration
  # 使用 OpenAI 客户端指向 DeepSeek API（消息转换格式更准确）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      connect-timeout: 30s
      read-timeout: 120s
      # DeepSeek 思考模式参数（非标准 OpenAI 属性，通过 @Value 手动注入）
      deepseek:
        thinking: disabled      # 思考模式开关 enabled/disabled
        reasoning-effort: high  # 思考强度 (high/max)
      chat:
        options:
          model: deepseek-v4-flash
          max-tokens: 16384





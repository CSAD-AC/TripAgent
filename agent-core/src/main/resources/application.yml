spring:
  application:
    name: Agent

  config:
    import: optional:classpath:.env[.properties]

  profiles:
    default: deepseek

  ai:
    mcp:
      client:
        enabled: true
        name: agent-client
        version: 1.0.0
        type: SYNC
        streamable-http:
          connections:
            local-mcp:
              url: http://localhost:8081
              endpoint: /mcp

agent:
  react:
    max-iterations: 20
    timeout-seconds: 30

clarify:
  timeout-minutes: 10

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    uno.zhuchen.agent: DEBUG
    uno.zhuchen.workflow: DEBUG
    org.springframework.ai: INFO
    #reactor.netty.http.client: DEBUG   # 打印 HTTP 请求/响应 body，调试 DeepSeek 400 时开启
---
spring:
  config:
    activate:
      on-profile: dashscope
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      connection-timeout: 30000
      read-timeout: 120000
      chat:
        options:
          model: qwen3.6-flash
          multi-model: true
---
spring:
  config:
    activate:
      on-profile: dev
  ai:
    dashscope:
      chat:
        options:
          model: qwen-turbo
---
spring:
  config:
    activate:
      on-profile: deepseek
  autoconfigure:
    exclude:
      # spring-ai-alibaba-starter-dashscope 在 classpath 上，deepseek profile 下不需 DashScope
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration
  # 使用 OpenAI 客户端指向 DeepSeek API（消息转换格式更准确）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      connect-timeout: 30s
      read-timeout: 120s
      # DeepSeek 思考模式参数（非标准 OpenAI 属性，通过 @Value 手动注入）
      deepseek:
        thinking: enabled      # 思考模式开关 enabled/disabled
        reasoning-effort: high  # 思考强度 (high/max)
      chat:
        options:
          model: deepseek-v4-flash
          max-tokens: 16384

---
# ============================================================
# 持久化配置（datasource / mybatis-plus / redis / flyway）
# 注意：仅在非 dev/test profile 下生效
# ============================================================
spring:
  config:
    activate:
      on-profile: deepseek & !dev & !test

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    slow-sql-ms: 500
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: status
      logic-delete-value: deleted
      logic-not-delete-value: active

# Actuator / Micrometer 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: travelpal-agent





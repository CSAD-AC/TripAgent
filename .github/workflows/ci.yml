# ============================================================
# TravelPal (TripAgent) 主 CI
# ------------------------------------------------------------
# 触发: push 到 main / master, 任意 pull_request, 以及手动 workflow_dispatch
# 覆盖: 后端编译 + 单元测试 + 打包(jar), 前端类型检查 + 生产构建, 以及
#       workflow 文件自身的语法静态检查
#
# 设计要点:
# 1. 本 workflow 只跑不依赖外部服务的测试(用 -DexcludedGroups=integration
#    排除 @Tag("integration") 的测试), 因此不需要 MySQL / Redis / Milvus,
#    也不需要在仓库里放任何 .env 或密钥, fork 出来的 PR 同样能跑绿.
# 2. 需要真实外部服务的集成测试走 integration-tests.yml(手动触发, 需配置
#    GitHub Secrets), 不挂在 push 上, 避免未配置密钥时把主 CI 拖红.
# 3. 不加 paths 过滤: 作为分支保护的必需检查(required status check)时,
#    paths 过滤会让某些 PR 永远等不到检查结果而卡住合并.
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次未完成的运行, 节约 runner 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限: CI 只需要读代码, 不需要写任何东西
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # 后端: 编译 + 单元测试 + 打包
  # ----------------------------------------------------------
  backend:
    name: 后端编译与单元测试 (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17 并缓存 Maven 本地仓库
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译, 单元测试与打包
        # -B 批处理模式(日志更适合 CI), -ntp 关闭下载进度条,
        # -DexcludedGroups=integration 排除需要 MySQL / Redis / Milvus / 真实 API Key 的测试
        run: mvn -B -ntp verify -DexcludedGroups=integration

      - name: 上传 Surefire 测试报告
        # 失败时也要上传, 否则拿不到失败原因
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 JaCoCo 覆盖率报告
        # 只生成报告, 不设覆盖率阈值: 覆盖率低不会让构建失败
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-report
          # 每个模块各自的 HTML / XML 报告
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传可执行 jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jars
          # spring-boot-maven-plugin 重新打包后的可执行 jar
          path: '**/target/*.jar'
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------
  # 前端: 依赖安装 + 类型检查 + 生产构建
  # ----------------------------------------------------------
  frontend:
    name: 前端类型检查与构建 (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node 22 并缓存 npm 下载缓存
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 按 lock 文件安装依赖
        # 用 npm ci 而不是 npm install: 严格按 package-lock.json 安装,
        # 锁文件与 package.json 不一致时直接失败, 保证构建可复现
        run: npm ci

      - name: 类型检查与生产构建
        # package.json 的 build 脚本 = tsc && vite build, tsc 报错即失败
        run: npm run build

      - name: 上传前端构建产物
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------
  # Workflow 自身的语法与最佳实践静态检查
  # ----------------------------------------------------------
  workflow-lint:
    name: Workflow 配置静态检查 (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 运行 actionlint
        # 检查 .github/workflows/*.yml 的语法错误, 表达式错误,
        # 无效的 action 输入, shellcheck 级别的脚本问题等
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # ----------------------------------------------------------
  # 密钥泄漏扫描
  # ----------------------------------------------------------
  secret-scan:
    name: 密钥泄漏扫描 (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 必须拉全量历史: 默认的浅克隆只有 1 个提交, 扫不到历史泄漏
          fetch-depth: 0

      - name: 扫描全部提交历史中的密钥
        # 版本写死, 避免工具自身升级改变判定规则.
        # --baseline-path 指向 .github/gitleaks-baseline.json, 里面记录了
        # 2026-06 那次历史泄漏的指纹(该 AMAP key 已作废), 只抑制这一条已知发现;
        # 之后任何新的密钥泄漏仍然会让这一步失败.
        # --redact 保证即使命中也不会把密钥明文写进 CI 日志.
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="--all" \
            --baseline-path /repo/.github/gitleaks-baseline.json \
            --redact --no-banner

  # ----------------------------------------------------------
  # 镜像构建验证: 只构建, 不推送任何 registry
  # ----------------------------------------------------------
  images:
    name: 镜像构建验证 (不推送)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 镜像构建较慢(容器内要从零拉依赖并编译), 只在推送主分支和手动触发时跑,
    # 避免每个 PR 都多等几分钟. 想让 PR 也验证就把下面这行 if 删掉.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      # 显式打开 BuildKit: Dockerfile 里的 RUN --mount=type=cache 依赖它
      DOCKER_BUILDKIT: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 查看 Docker 版本
        run: docker version --format '{{.Server.Version}}'

      - name: 构建三个镜像 (不推送)
        # build context 统一为仓库根: Maven 父 pom 在根目录, -pl / -am 必须在根执行.
        # .env 已被 .dockerignore 挡在构建上下文之外, Dockerfile 内还有 jar 级自检作第二道防线.
        run: |
          set -euo pipefail
          docker build -f agent-core/Dockerfile -t tripagent/agent-core:ci .
          docker build -f mcp-server/Dockerfile -t tripagent/mcp-server:ci .
          docker build -f frontend/Dockerfile -t tripagent/frontend:ci .

      - name: 输出镜像大小
        run: docker images --filter reference='tripagent/*' --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

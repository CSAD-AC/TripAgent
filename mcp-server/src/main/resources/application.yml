spring:
  application:
    name: mcp-server

  config:
    import: optional:classpath:.env[.properties]

  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: mcp-server
        version: 1.0.0
        type: SYNC

    # RAG: DashScope Embedding (text-embedding-v3, 1024 维)
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          model: text-embedding-v3
      # RAG: DashScope Rerank (混合检索重排, 不可用时降级 degraded=rerank)
      rerank:
        options:
          model: gte-rerank
          top-n: ${RAG_RERANK_TOP_N:5}

    # RAG: Milvus 向量库 (启动前需先 docker compose up, 见 docker/milvus/)
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          # 短超时: Milvus 停机时 TCP 层 hang, 必须快速失败以回落检索层降级
          connect-timeout-ms: 3000
          rpc-deadline-ms: 5000
        collection-name: knowledge_chunk
        database-name: default
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

  # RAG: 知识库源数据 (MySQL 为源, Milvus 为可重建索引)
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:TripAgent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

  flyway:
    enabled: true
    locations: classpath:db/rag-migration
    table: rag_schema_history   # 与 agent-core 的 flyway_schema_history 区分, 互不干扰
    baseline-on-migrate: true

server:
  port: 8081

amap:
  api:
    key: ${AMAP_API_KEY}

# 云端搜索配置（替换原自建 Bing 爬虫）
search:
  cloud:
    provider: baidu-tavily-fallback  # 搜索后端：baidu / tavily / baidu-tavily-fallback
    baidu-api-key: ${BAIDU_API_KEY}
    tavily-api-key: ${TAVILY_API_KEY}
# 页面抓取配置
fetch:
  timeout-seconds: 15       # 单次抓取超时（页面下载比搜索慢）
  max-content-length: 5000  # 正文最大返回字符数（防 token 爆炸）

logging:
  level:
    uno.zhuchen.agent.mcpserver: DEBUG

# ============================================================
# MCP 工具开关配置（按次启动控制）
# ============================================================
# 所有工具默认启用。当次启动只需把想关闭的工具设为 false 即可。
# 分组 enabled: false 可关闭整组工具（连同组内所有工具）。
# 工具 key 由类名自动转换，规则：驼峰转 kebab-case + 去掉 Tool 后缀
#   例如 WeatherQueryTool → weather-query,  GeocodeTool → geocode
mcp:
  tool-groups:
    amap:
      enabled: true
      tools:
        geocode: true
        route-planning: true
        poi-search: true
        weather: true
    ticket12306:
      enabled: true
      tools:
        current-date: true
        station: true
        ticket-query: true
        interline-ticket: true
        train-route: true

    # 云端工具（百度千帆搜索 / 网页抓取），不属于高德
    cloud:
      enabled: true
      tools:
        web-search: true
        page-fetch: true

    # RAG 知识库工具组（向量检索 / 知识库统计）
    rag:
      enabled: true
      tools:
        knowledge-search: true
        knowledge-stats: true

# RAG 种子数据开关 (首次启动幂等注入示例旅游知识, 便于演示与验收)
rag:
  seed:
    enabled: true
  # RAG 文档入库分块参数 (改参后可用 reindex 重建验证)
  ingestion:
    chunk-size: 500       # 目标块大小(字符数, 中文约一顿口语 0.75 token/字)
    chunk-overlap: 60     # 相邻块重叠(字符数, 约 12%)
    min-chunk: 50         # 小于该长度的块与相邻块合并

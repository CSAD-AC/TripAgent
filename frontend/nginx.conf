# =============================================================================
# TravelPal 前端 nginx 站点配置
# 由 frontend/Dockerfile 复制到 /etc/nginx/conf.d/default.conf
#
# 职责:
#   1. 托管 React SPA 静态产物, 非文件路由回退到 index.html
#   2. 把 /api/** 反代到 agent-core:8080 (Compose 服务名)
#   3. SSE 流式接口 (/api/chat/stream | /graph | /multi) 关闭代理缓冲,
#      否则 thinking_token 会被 nginx 攒到连接结束才吐, 前端失去流式效果
#
# 注意: add_header 的继承规则是 "子块自己写了 add_header 就不再继承父块的",
# 所以这里只在 server 级别声明安全响应头, location 里改用 expires 实现缓存策略.
# =============================================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 知识库文档上传走 /api/knowledge/documents (multipart), 默认 1m 会 413
    client_max_body_size 50m;

    charset utf-8;

    # ---- 压缩 ----------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/wasm;

    # ---- 安全响应头(静态站点) -------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ---- SPA 路由回退 --------------------------------------------------------
    # 客户端路由(如 /knowledge)刷新时不能让 nginx 返回 404, 统一回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存, 保证新版本发布后立即生效 (expires -1 => Cache-Control: no-cache)
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # 带内容哈希的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # ---- SSE 流式接口: 必须关缓冲 -------------------------------------------
    # 覆盖 /api/chat/stream,/api/chat/graph,/api/chat/multi,/api/chat/answer
    location ^~ /api/chat/ {
        proxy_pass              http://agent-core:8080;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        # 清空 Connection 头才能让上游走 keep-alive 长连接(SSE 必需)
        proxy_set_header        Connection        "";

        # SSE 三件套: 不缓冲 / 不缓存 / 长超时
        proxy_buffering          off;
        proxy_cache              off;
        proxy_request_buffering  off;
        chunked_transfer_encoding on;
        proxy_read_timeout       3600s;
        proxy_send_timeout       3600s;
    }

    # ---- 其余 REST 接口 ------------------------------------------------------
    location /api/ {
        proxy_pass              http://agent-core:8080;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        proxy_connect_timeout   10s;
        proxy_read_timeout      120s;
        proxy_send_timeout      120s;
    }

    # 反代失败时的友好提示页(文件由 Dockerfile 生成, 避免 error_page 内部重定向环)
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
